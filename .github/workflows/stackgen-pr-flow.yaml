name: Stackgen Provision
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      STACKGEN_URL: ${{ vars.STACKGEN_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract appstack name from PR title
        id: extract-appstack
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^PR\ created\ for\ (.+)$ ]]; then
            echo "APPSTACK_NAME=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "PR title does not match the required format: 'PR created for <appstack name>'"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Configure Stackgen
        uses: ./.github/actions/setup-stackgen
        with:
          stackgen-token: ${{ secrets.STACKGEN_TOKEN }}
          stackgen-url: ${{ env.STACKGEN_URL }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get UUID for appstack
        id: get-uuid
        run: |
          APPSTACK_UUID=$(stackgen appstack show -o json | jq -r --arg name "${{ env.APPSTACK_NAME }}" '.[] | select(.appstack_name == $name) | .uuid')
          if [ -z "$APPSTACK_UUID" ]; then
            echo "Could not find appstack with name: ${{ env.APPSTACK_NAME }}"
            exit 1
          fi
          echo "APPSTACK_UUID=$APPSTACK_UUID" >> $GITHUB_ENV

      - name: Run Stackgen provision
        run: stackgen provision --appstack-id ${{ env.APPSTACK_UUID }} --var="region=${{ vars.AWS_REGION }}"
